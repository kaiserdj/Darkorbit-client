name: Release

# Releasing is automatic: bump "version" in package.json and push it to main.
# The release can also be started (or a failed one resumed) from the Actions tab.
#
# Flow: check version -> lint and tests -> draft release -> build every platform into the
# draft -> publish. The release only becomes public when all platforms built successfully.
#
# Optional code signing secrets (builds are unsigned when they are not set):
#   MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD  base64 .p12 Developer ID certificate and its password
#   WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD  base64 .pfx code signing certificate and its password

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide whether to release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # On push, only a changed version number starts a release (other package.json edits do not).
          if [ "$EVENT" = "push" ] && git fetch --quiet --depth=1 origin "$BEFORE" 2>/dev/null; then
            previous=$(git show "$BEFORE:package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')
            if [ "$previous" = "$version" ]; then
              echo "Version is still $version, nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # A published release is never rebuilt; an existing draft (failed run) is resumed.
          if [ "$(gh release view "v$version" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            echo "v$version is already released."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$version."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Lint and unit tests
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  draft:
    name: Create draft release
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create the draft release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Resuming the existing draft v$VERSION."
          else
            gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: [check, draft]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --mac
          - name: Windows
            os: windows-latest
            args: --win
          - name: Linux
            os: ubuntu-latest
            args: --linux

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron-builder uploads the installers and the latest*.yml update files into the draft.
      - name: Build and upload
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK || matrix.os == 'windows-latest' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD || matrix.os == 'windows-latest' && secrets.WIN_CSC_KEY_PASSWORD || '' }}

  publish:
    name: Publish release
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release edit "v$VERSION" --draft=false --latest
          echo "Released https://github.com/$GH_REPO/releases/tag/v$VERSION"
