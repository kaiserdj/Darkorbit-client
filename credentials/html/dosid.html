<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login with Dosid</title>

    <link href="../../libs/bootstrap/bootstrap.min.css" rel="stylesheet">

    <link href="./css/masterLogin.css" rel="stylesheet">
</head>

<body class="text-center" id="dosid">
    <main class="form-signin" style="max-width: 460px;">
        <form id="form">
            <img class="mb-3" src="./assets/icon.png" alt="" width="72" height="57">
            <h1 class="h4 mb-3 fw-normal">Login with Dosid</h1>
            <label for="url" class="visually-hidden">Server url with dosid</label>
            <input type="text" id="url" class="form-control mb-3" placeholder="https://es1.darkorbit.com/?dosid=c21cf6377518dd6e93450c6085a548b1" maxlength="300" autocapitalize="off" autocorrect="off" spellcheck="false" required autofocus>
            <div class="d-flex gap-2">
                <button class="w-50 btn btn-lg btn-primary" type="submit">Login</button>
                <button class="w-50 btn btn-lg btn-danger" type="button" id="cancel">Cancel</button>
            </div>
        </form>
    </main>
</body>

</html>
